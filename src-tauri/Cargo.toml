[package]
name = "frigate-popup"
version = "0.2.0"
description = "Borderless always-on-top camera popups driven by Frigate NVR events"
authors = ["Evan Neff"]
edition = "2021"
rust-version = "1.82"
license = "MIT"
repository = "https://github.com/evankneff/SpideySense"
readme = "../README.md"

[lib]
name = "frigate_popup_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1.0.104"
dirs = "6.0.0"
rumqttc = { version = "0.25.1", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2.11.5", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2.5.1"
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-opener = "2.5.4"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt", "macros", "time", "sync"] }
toml = "1.0.7"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.3", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Threading",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
